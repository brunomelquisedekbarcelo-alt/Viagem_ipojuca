<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planejamento da Viagem - Ipojuca</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#333;
}

header{
    background:#0f766e;
    color:white;
    padding:24px;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:20px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

.tab{
    border:none;
    cursor:pointer;
    padding:12px 18px;
    border-radius:10px;
    background:#e5e7eb;
    font-weight:bold;
}

.tab.active{
    background:#0f766e;
    color:white;
}

.aba{
    display:none;
}

.aba.ativa{
    display:block;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

details{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
}

summary{
    padding:15px;
    cursor:pointer;
    font-weight:bold;
    background:#f8fafc;
}

.bloco{
    padding:15px;
    margin:10px;
    border-radius:8px;
    background:#f8fafc;
}

.categoria{
    margin-bottom:25px;
}

.categoria h3{
    margin-bottom:12px;
    color:#0f766e;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0f766e;
    color:white;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

tr:nth-child(even){
    background:#fafafa;
}

.loading{
    text-align:center;
    padding:20px;
}

.erro{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:8px;
}

</style>

</head>

<body>

<header>

<h1>Planejamento da Viagem - Ipojuca/PE</h1>

<div id="ultimaAtualizacao">
Carregando...
</div>

</header>

<div class="container">

<div id="erro"></div>

<div class="tabs">

<button class="tab active"
onclick="abrirAba('viagem',this)">
📍 Viagem
</button>

<button class="tab"
onclick="abrirAba('cafe',this)">
☕ Café da Manhã
</button>

<button class="tab"
onclick="abrirAba('almoco',this)">
🍽 Almoço
</button>

<button class="tab"
onclick="abrirAba('lanche',this)">
🥪 Lanche
</button>

<button class="tab"
onclick="abrirAba('jantar',this)">
🌙 Jantar
</button>

<button class="tab"
onclick="abrirAba('ingredientes',this)">
🛒 Ingredientes
</button>

</div>

<div id="viagem" class="aba ativa">
<div class="card"></div>
</div>

<div id="cafe" class="aba">
<div class="card"></div>
</div>

<div id="almoco" class="aba">
<div class="card"></div>
</div>

<div id="lanche" class="aba">
<div class="card"></div>
</div>

<div id="jantar" class="aba">
<div class="card"></div>
</div>

<div id="ingredientes" class="aba">
<div class="card"></div>
</div>

</div>

<script>

const SHEET_ID = "1nIWKndBOY-c6DL4pil-ZI1sXgCGO1eOZddWOnWanQjI";

const GIDS = {
    viagem: 1196950908,
    cafe: 388995602,
    almoco: 674787523,
    lanche: 1639570066,
    jantar: 1151968492,
    ingredientes: 896032985
};

function abrirAba(id, btn) {

    document.querySelectorAll(".aba")
        .forEach(el => el.classList.remove("ativa"));

    document.querySelectorAll(".tab")
        .forEach(el => el.classList.remove("active"));

    document.getElementById(id)
        .classList.add("ativa");

    btn.classList.add("active");
}

function montarURL(gid) {

    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=out:json`;

}

async function carregarAba(gid) {

    const response = await fetch(
        montarURL(gid)
    );

    const text = await response.text();

    const inicio = text.indexOf("{");
    const fim = text.lastIndexOf("}");

    return JSON.parse(
        text.substring(inicio, fim + 1)
    );

}

async function carregarViagem() {

    const json = await carregarAba(
        GIDS.viagem
    );

    let html =
        '<div class="card"><ul style="line-height:2">';

    json.table.rows.forEach(row => {

        if (!row.c || !row.c[0])
            return;

        html += `
            <li>
                <strong>${row.c[0]?.v ?? ""}</strong>
                : ${row.c[1]?.v ?? ""}
            </li>
        `;

    });

    html += "</ul></div>";

    document.getElementById("viagem")
        .innerHTML = html;
}

async function carregarRefeicao(gid, destino) {

    const json =
        await carregarAba(gid);

    let html = '<div class="card">';

    json.table.rows.forEach((row, index) => {

        if (index === 0)
            return;

        const data =
            row.c[0]?.v ?? "";

        const dia =
            row.c[1]?.v ?? "";

        const cardapio =
            row.c[2]?.v ?? "";

        const ingredientes =
            row.c[3]?.v ?? "";

        html += `

        <details>

            <summary>
                ${data} - ${dia}
            </summary>

            <div class="bloco">

                <strong>Cardápio</strong>

                <p>
                    ${cardapio}
                </p>

            </div>

            <div class="bloco">

                <strong>Ingredientes</strong>

                <p>
                    ${ingredientes}
                </p>

            </div>

        </details>

        `;

    });

    html += "</div>";

    document.getElementById(destino)
        .innerHTML = html;
}

async function carregarIngredientes() {

    const json =
        await carregarAba(
            GIDS.ingredientes
        );

    const categorias = {};

    json.table.rows.forEach((row, index) => {

        if (index === 0)
            return;

        const categoria =
            row.c[0]?.v ?? "";

        if (!categorias[categoria])
            categorias[categoria] = [];

        categorias[categoria].push({

            ingrediente:
                row.c[1]?.v ?? "",

            quantidade:
                row.c[2]?.v ?? "",

            unidade:
                row.c[3]?.v ?? ""

        });

    });

    let html = '<div class="card">';

    Object.keys(categorias)
        .forEach(categoria => {

            html += `

            <div class="categoria">

                <h3>${categoria}</h3>

                <table>

                    <tr>

                        <th>Ingrediente</th>
                        <th>Quantidade</th>
                        <th>Unidade</th>

                    </tr>

            `;

            categorias[categoria]
                .forEach(item => {

                    html += `

                    <tr>

                        <td>${item.ingrediente}</td>

                        <td>${item.quantidade}</td>

                        <td>${item.unidade}</td>

                    </tr>

                    `;

                });

            html += `

                </table>

            </div>

            `;

        });

    html += "</div>";

    document.getElementById("ingredientes")
        .innerHTML = html;
}

async function atualizar() {

    try {

        await Promise.all([

            carregarViagem(),

            carregarRefeicao(
                GIDS.cafe,
                "cafe"
            ),

            carregarRefeicao(
                GIDS.almoco,
                "almoco"
            ),

            carregarRefeicao(
                GIDS.lanche,
                "lanche"
            ),

            carregarRefeicao(
                GIDS.jantar,
                "jantar"
            ),

            carregarIngredientes()

        ]);

        document.getElementById(
            "ultimaAtualizacao"
        ).innerHTML =
            "Última atualização: " +
            new Date().toLocaleString(
                "pt-BR"
            );

    }
    catch (erro) {

        console.error(erro);

        document.getElementById(
            "erro"
        ).innerHTML = `

        <div class="erro">

            Erro ao carregar
            os dados da planilha.

        </div>

        `;
    }

}

atualizar();

setInterval(
    atualizar,
    300000
);

</script>

</body>
</html>
