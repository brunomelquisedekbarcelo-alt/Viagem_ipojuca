<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Planejamento da Viagem - Ipojuca</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

#mapa{
    width:100%;
    height:420px;
    border-radius:12px;
    margin-top:20px;
    z-index:0;
}

.links-mapa{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
}

.links-mapa a{
    display:block;
    text-align:center;
    padding:7px 10px;
    border-radius:6px;
    background:#0f766e;
    color:white !important;
    text-decoration:none;
    font-weight:bold;
}

.lista-pontos{
    margin-top:15px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.lista-pontos button{
    border:1px solid #0f766e;
    background:white;
    color:#0f766e;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.busca{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    font-size:15px;
}

.total{
    margin-bottom:10px;
    color:#555;
}

.tabela-wrap{
    overflow-x:auto;
}

/* ---------- Blocos de destaque (datas/voos e resumo financeiro) ---------- */

.tiles{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
    margin:12px 0 4px;
}

.tile{
    background:#f0fdfa;
    border:1px solid #ccfbf1;
    border-radius:10px;
    padding:12px 14px;
}

.tile-rotulo{
    font-size:13px;
    color:#555;
    margin-bottom:4px;
}

.tile-valor{
    font-size:20px;
    font-weight:bold;
    color:#134e4a;
    font-variant-numeric:tabular-nums;
}

/* ---------- Gráfico de barras do financeiro ---------- */

.fin-secao{
    margin-top:26px;
}

.fin-secao h3{
    color:#0f766e;
    margin-bottom:4px;
}

.fin-legenda{
    font-size:13px;
    color:#666;
    margin-bottom:12px;
}

.barra-linha{
    display:grid;
    grid-template-columns:minmax(120px,240px) 1fr auto;
    align-items:center;
    gap:10px;
    padding:5px 4px;
    border-radius:6px;
}

.barra-linha:hover{
    background:#f3f4f6;
}

.barra-nome{
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.barra-trilho{
    height:14px;
    background:#f1f5f9;
    border-radius:4px;
    overflow:hidden;
}

.barra{
    height:100%;
    border-radius:0 4px 4px 0;
    min-width:3px;
}

.barra.deve{ background:#c2410c; }
.barra.recebe{ background:#0f766e; }

.barra-valor{
    font-size:14px;
    font-weight:bold;
    font-variant-numeric:tabular-nums;
    min-width:96px;
    text-align:right;
}

/* ---------- Passageiros: link no nome + visualizador ---------- */

.dica-cartao{
    font-size:14px;
    color:#555;
    margin-bottom:10px;
}

.link-cartao{
    background:none;
    border:none;
    padding:0;
    font:inherit;
    color:#0f766e;
    font-weight:bold;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    text-align:left;
}

.link-cartao:hover{
    color:#134e4a;
}

.visor{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(15,23,42,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.visor[hidden]{
    display:none;
}

.visor-caixa{
    background:#111827;
    color:white;
    border-radius:14px;
    width:min(960px,100%);
    height:min(92vh,100%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.visor-topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid #374151;
}

.visor-titulo{
    font-weight:bold;
    font-size:16px;
}

.visor-contador{
    font-size:12px;
    color:#9ca3af;
}

.visor-acoes{
    display:flex;
    gap:8px;
}

.visor-acoes a,
.visor-acoes button{
    width:38px;
    height:38px;
    border-radius:8px;
    border:none;
    background:#374151;
    color:white;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.visor-acoes a:hover,
.visor-acoes button:hover{
    background:#4b5563;
}

.visor-corpo{
    flex:1;
    display:flex;
    align-items:stretch;
    min-height:0;
}

.visor-seta{
    width:48px;
    flex-shrink:0;
    border:none;
    background:transparent;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.visor-seta:hover:not(:disabled){
    background:rgba(255,255,255,.08);
}

.visor-seta:disabled{
    opacity:.2;
    cursor:default;
}

.visor-conteudo{
    flex:1;
    min-width:0;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b1220;
}

.visor-conteudo img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    cursor:zoom-in;
    background:white;
}

.visor-conteudo.zoom{
    align-items:flex-start;
    justify-content:flex-start;
}

.visor-conteudo.zoom img{
    max-width:none;
    max-height:none;
    width:200%;
    cursor:zoom-out;
}

.visor-conteudo iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

.visor-carregando{
    color:#9ca3af;
}

.visor-rodape{
    font-size:12px;
    color:#9ca3af;
    text-align:center;
    padding:8px;
    border-top:1px solid #374151;
}

@media (max-width:560px){
    .visor{ padding:0; }

}

.legenda-cores{

.legenda-cores i,

.devedor{

.devedor-topo{

    margin-bottom:8px;
}

.devedor-nome{

}

.devedor-total{
    font-weight:bold;
    color:#9a3412;

}

.barra-trilho.empilhada{
    display:flex;
    gap:2px;
    background:transparent;
}

.seg{
    height:100%;

}

.seg:last-child{
    border-radius:0 4px 4px 0;
}

.destinos{
    list-style:none;

}

.recebedor{
    border:1px solid #e5e7eb;
}

.recebedor summary{
    background:white;

}

.recebedor summary::-webkit-details-marker{

.recebedor-sub{

table.mini{

table.mini td{

.chips{

<div id="visor" class="visor" hidden onclick="if(event.target===this)fecharCartao()">
    <div class="visor-caixa" role="dialog" aria-modal="true" aria-labelledby="visorTitulo">
        <div class="visor-topo">
            <div>
                <div class="visor-titulo" id="visorTitulo"></div>
                <div class="visor-contador" id="visorContador"></div>
            </div>
            <div class="visor-acoes">
                <a id="visorAbrir" href="#" target="_blank" rel="noopener" title="Abrir no Google Drive">↗</a>
                <button id="visorFechar" onclick="fecharCartao()" title="Fechar (Esc)" aria-label="Fechar">✕</button>
            </div>
        </div>
        <div class="visor-corpo">
            <button class="visor-seta" id="visorAnterior" onclick="abrirCartao(cartaoAtual-1)" aria-label="Anterior">‹</button>
            <div class="visor-conteudo" id="visorConteudo"></div>
            <button class="visor-seta" id="visorProximo" onclick="abrirCartao(cartaoAtual+1)" aria-label="Próximo">›</button>
        </div>
        <div class="visor-rodape">Toque na imagem para ampliar · Esc para fechar</div>
    </div>
</div>

<script>

const SHEET_ID = "1nIWKndBOY-c6DL4pil-ZI1sXgCGO1eOZddWOnWanQjI";

// As abas são buscadas pelo NOME (não pelo gid). Assim o site continua
// funcionando mesmo se uma aba for recriada, duplicada ou reordenada.
// Se renomear uma aba na planilha, altere o nome aqui também.
const GIDS = {
    viagem: "Viagem",
    cafe: "CafeManha",
    almoco: "Almoco",
    lanche: "Lanche",
    jantar: "Jantar",
    ingredientes: "Ingredientes",
    passageiros: "ListaPassageiros",
    financeiro: "Financeiro",
    saldo: "Saldo",
    extrato: "Extrato"
};

let mapa = null;
let camadaMarcadores = null;
let dadosPassageiros = { cabecalho: [], linhas: [] };
let cartoesEmbarque = [];
let cartaoAtual = -1;

/* ===================== VISUALIZADOR DE CARTÃO DE EMBARQUE ===================== */

function idDrive(url) {
    const m = String(url).match(/\/d\/([\w-]{10,})/) || String(url).match(/[?&]id=([\w-]{10,})/);
    return m ? m[1] : null;
}

function abrirCartao(i) {
    if (i < 0 || i >= cartoesEmbarque.length) return;
    cartaoAtual = i;

    const { nome, link } = cartoesEmbarque[i];
    const id = idDrive(link);
    const area = document.getElementById("visorConteudo");

    document.getElementById("visorTitulo").textContent = nome;
    document.getElementById("visorContador").textContent =
        cartoesEmbarque.length > 1 ? `${i + 1} de ${cartoesEmbarque.length}` : "";
    document.getElementById("visorAbrir").href = link;
    document.getElementById("visorAnterior").disabled = i === 0;
    document.getElementById("visorProximo").disabled = i === cartoesEmbarque.length - 1;

    area.classList.remove("zoom");
    area.innerHTML = `<div class="visor-carregando">Carregando…</div>`;

    // Tenta mostrar como imagem; se não der (ex.: PDF), usa o visualizador do Drive
    const fallback = () => {
        const src = id ? `https://drive.google.com/file/d/${id}/preview` : link;
        area.innerHTML = `<iframe src="${escapar(src)}" allow="autoplay" title="Cartão de embarque de ${escapar(nome)}"></iframe>`;
    };

    const ehImagemDireta = /\.(png|jpe?g|webp|gif)(\?|$)/i.test(link);
    if (!id && !ehImagemDireta) { fallback(); }
    else {
        const img = new Image();
        img.alt = `Cartão de embarque de ${nome}`;
        const limite = setTimeout(() => {
            if (cartaoAtual === i && !img.complete) { img.onload = img.onerror = null; fallback(); }
        }, 6000);
        img.onload = () => {
            clearTimeout(limite);
            if (cartaoAtual !== i) return;
            area.innerHTML = "";
            area.appendChild(img);
            img.onclick = () => area.classList.toggle("zoom");
        };
        img.onerror = () => { clearTimeout(limite); if (cartaoAtual === i) fallback(); };
        img.src = id ? `https://lh3.googleusercontent.com/d/${id}=w2000` : link;
    }

    const visor = document.getElementById("visor");
    visor.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("visorFechar").focus();
}

function fecharCartao() {
    document.getElementById("visor").hidden = true;
    document.getElementById("visorConteudo").innerHTML = "";
    document.body.style.overflow = "";
    cartaoAtual = -1;
}

document.addEventListener("keydown", e => {
    if (document.getElementById("visor")?.hidden !== false) return;
    if (e.key === "Escape") fecharCartao();
    if (e.key === "ArrowLeft") abrirCartao(cartaoAtual - 1);
    if (e.key === "ArrowRight") abrirCartao(cartaoAtual + 1);
});

// Deslizar para os lados no celular troca de cartão
(() => {
    let x0 = null;
    document.addEventListener("touchstart", e => {
        if (!document.getElementById("visor")?.hidden) x0 = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", e => {
        if (x0 === null || document.getElementById("visor")?.hidden) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (document.getElementById("visorConteudo").classList.contains("zoom")) return;
        if (Math.abs(dx) > 60) abrirCartao(cartaoAtual + (dx < 0 ? 1 : -1));
    }, { passive: true });
})();

function abrirAba(id, btn) {

    document.querySelectorAll(".aba")
        .forEach(el => el.classList.remove("ativa"));

    document.querySelectorAll(".tab")
        .forEach(el => el.classList.remove("active"));

    document.getElementById(id)
        .classList.add("ativa");

    btn.classList.add("active");

    // O Leaflet precisa recalcular o tamanho quando a aba fica visível
    if (id === "viagem" && mapa)
        setTimeout(() => mapa.invalidateSize(), 50);
}

// Acha a coluna pelo título (ignora acentos/maiúsculas); se não achar, usa a posição padrão
function indiceColuna(json, regex, padrao) {
    const tira = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
    const i = json.table.cols.findIndex(c => regex.test(tira(c.label)));
    return i >= 0 ? i : padrao;
}

function valorCelula(c) {
    if (!c) return "";
    if (c.f != null) return c.f;
    return c.v ?? "";
}

function escapar(txt) {
    return String(txt)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

/* Procura coordenadas na linha. Aceita:
   - "-8.4012, -34.9876" numa célula
   - latitude numa coluna e longitude na seguinte
   - link do Google Maps contendo @lat,lng ou q=lat,lng */
function extrairCoordenada(row) {

    const valores = row.c.map(c => c ? c.v : null);

    const regex = /(-?\d{1,2}[.,]\d+)\s*[,;]\s*(-?\d{1,3}[.,]\d+)/;

    for (const v of valores) {
        if (typeof v !== "string") continue;
        const m = v.match(/[@=](-?\d+\.\d+),\s*(-?\d+\.\d+)/) ||
                  v.replace(/\s+/g, " ").match(regex);
        if (m) {
            const lat = parseFloat(m[1].replace(",", "."));
            const lng = parseFloat(m[2].replace(",", "."));
            if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180)
                return { lat, lng };
        }
    }

    const ehDecimal = v => {
        if (v == null || v === "") return null;
        const s = String(v).trim().replace(",", ".");
        if (!/^-?\d+\.\d+$/.test(s)) return null;
        return parseFloat(s);
    };

    for (let i = 1; i < valores.length - 1; i++) {
        const lat = ehDecimal(valores[i]);
        const lng = ehDecimal(valores[i + 1]);
        if (lat !== null && lng !== null &&
            Math.abs(lat) <= 90 && Math.abs(lng) <= 180)
            return { lat, lng };
    }

    return null;
}

function linksNavegacao(p) {

    const coord = `${p.lat},${p.lng}`;
    const nome = encodeURIComponent(p.nome);

    return `
        <div class="links-mapa">
            <a href="https://www.google.com/maps/search/?api=1&query=${coord}" target="_blank" rel="noopener">Google Maps</a>
            <a href="https://waze.com/ul?ll=${coord}&navigate=yes" target="_blank" rel="noopener">Waze</a>
            <a href="https://maps.apple.com/?ll=${coord}&q=${nome}" target="_blank" rel="noopener">Apple Mapas</a>
            <a href="geo:${coord}?q=${coord}(${nome})">Outro app (Android)</a>
        </div>
    `;
}

function desenharMapa(pontos) {

    if (typeof L === "undefined") {
        document.getElementById("mapa").innerHTML =
            '<div class="erro">Não foi possível carregar o mapa.</div>';
        return;
    }

    if (!mapa) {
        mapa = L.map("mapa");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap"
        }).addTo(mapa);
        camadaMarcadores = L.layerGroup().addTo(mapa);
    }

    camadaMarcadores.clearLayers();

    const marcadores = pontos.map(p =>
        L.marker([p.lat, p.lng])
            .bindPopup(`<strong>${escapar(p.nome)}</strong>${linksNavegacao(p)}`)
            .addTo(camadaMarcadores)
    );

    if (pontos.length === 1)
        mapa.setView([pontos[0].lat, pontos[0].lng], 15);
    else if (pontos.length > 1)
        mapa.fitBounds(L.latLngBounds(pontos.map(p => [p.lat, p.lng])), { padding: [40, 40] });

    document.querySelectorAll(".lista-pontos button")
        .forEach((btn, i) => {
            btn.onclick = () => {
                mapa.setView([pontos[i].lat, pontos[i].lng], 16);
                marcadores[i].openPopup();
                document.getElementById("mapa").scrollIntoView({ behavior: "smooth" });
            };
        });

    setTimeout(() => mapa.invalidateSize(), 50);
}

// Aceita o gid (número) ou o nome da aba (texto).
// headers=1 força a 1ª linha como cabeçalho; sem isso o Google às vezes
// "engole" várias linhas no cabeçalho (era o que escondia os horários de voo).
function montarURL(aba) {

    const ref = typeof aba === "number"
        ? `gid=${aba}`
        : `sheet=${encodeURIComponent(aba)}`;

    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${ref}&headers=1&tqx=out:json&_=${Date.now()}`;

}

async function carregarAba(gid) {

    const response = await fetch(
        montarURL(gid)
    );

    const text = await response.text();

    const inicio = text.indexOf("{");
    const fim = text.lastIndexOf("}");

    let json;
    try {
        json = JSON.parse(text.substring(inicio, fim + 1));
    } catch (e) {
        throw new Error(`Aba "${gid}": resposta inválida (a planilha está compartilhada como "qualquer pessoa com o link"?)`);
    }

    if (json.status === "error" || !json.table) {
        const motivo = json.errors?.map(e => e.detailed_message || e.message).join("; ") || "aba não encontrada";
        throw new Error(`Aba "${gid}": ${motivo}`);
    }

    return json;

}

async function carregarViagem() {

    const json = await carregarAba(
        GIDS.viagem
    );

    const pontos = [];
    const infoGeral = [];
    const infoVoos = [];
    const tabelas = [];      // blocos de linhas com 3+ colunas preenchidas
    let tabelaAtual = null;

    const REGEX_VOO = /in[íi]cio|^fim$|\bfim\b|\bida\b|\bvolta\b|hor[áa]rio d[eo] v|voo|v[ôo]o|a[ée]reo|embarque|partida|chegada|decolagem|pouso|aeroporto|check-?in|companhia a|\bcia\b|localizador|port[ãa]o de|latam/i;

    json.table.rows.forEach(row => {

        if (!row.c) {
            tabelaAtual = null;
            return;
        }

        // Valores já formatados (datas e horas como aparecem na planilha)
        const celulas = row.c.map(c => String(valorCelula(c)).trim());
        while (celulas.length && !celulas[celulas.length - 1])
            celulas.pop();

        const preenchidas = celulas.filter(v => v !== "");

        if (!preenchidas.length) {
            tabelaAtual = null;
            return;
        }

        const coord = extrairCoordenada(row);

        if (coord) {
            pontos.push({
                nome: celulas[0] || `Ponto ${pontos.length + 1}`,
                ...coord
            });
            tabelaAtual = null;
            return;
        }

        if (preenchidas.length >= 3) {
            if (!tabelaAtual) {
                tabelaAtual = [];
                tabelas.push(tabelaAtual);
            }
            tabelaAtual.push(celulas);
            return;
        }

        tabelaAtual = null;

        const item = {
            rotulo: celulas[0],
            valor: celulas.slice(1).filter(v => v).join(" · ")
        };

        if (REGEX_VOO.test(item.rotulo + " " + item.valor))
            infoVoos.push(item);
        else
            infoGeral.push(item);

    });

    const montarLista = itens => `
        <ul style="line-height:2;list-style:none">
            ${itens.map(i => `
                <li>
                    <strong>${escapar(i.rotulo)}</strong>${i.valor ? ": " + escapar(i.valor) : ""}
                </li>`).join("")}
        </ul>`;

    const montarTabela = linhas => {
        const n = Math.max(...linhas.map(l => l.length));
        const pad = l => Array.from({ length: n }, (_, i) => l[i] ?? "");
        const [cab, ...corpo] = linhas.length > 1 ? linhas : [[], ...linhas];
        return `
            <div class="tabela-wrap" style="margin-top:10px">
            <table>
                ${cab.length ? `<tr>${pad(cab).map(h => `<th>${escapar(h)}</th>`).join("")}</tr>` : ""}
                ${corpo.map(l => `<tr>${pad(l).map(v => `<td>${escapar(v)}</td>`).join("")}</tr>`).join("")}
            </table>
            </div>`;
    };

    let html = '<div class="card">';

    if (infoGeral.length)
        html += montarLista(infoGeral);

    const tabelasVoo = tabelas.filter(t => REGEX_VOO.test(t.flat().join(" ")));
    const outrasTabelas = tabelas.filter(t => !tabelasVoo.includes(t));

    if (infoVoos.length || tabelasVoo.length) {
        html += `<h3 style="margin-top:20px;color:#0f766e">✈️ Datas e voos</h3>`;
        if (infoVoos.length) html += `
            <div class="tiles">
                ${infoVoos.map(i => `
                    <div class="tile">
                        <div class="tile-rotulo">${escapar(i.rotulo)}</div>
                        <div class="tile-valor">${escapar(i.valor || "—")}</div>
                    </div>`).join("")}
            </div>`;
        tabelasVoo.forEach(t => html += montarTabela(t));
    }

    outrasTabelas.forEach(t => html += montarTabela(t));

    if (pontos.length) {
        html += `
            <h3 style="margin-top:20px;color:#0f766e">📌 Localizações</h3>
            <p style="color:#555;font-size:14px">Toque em um marcador para abrir no app de mapas.</p>
            <div class="lista-pontos">
                ${pontos.map(p => `<button>${escapar(p.nome)}</button>`).join("")}
            </div>
            <div id="mapa"></div>
        `;
    }

    html += "</div>";

    // Remove a instância antiga do mapa antes de recriar o HTML
    if (mapa) {
        mapa.remove();
        mapa = null;
    }

    document.getElementById("viagem")
        .innerHTML = html;

    if (pontos.length)
        desenharMapa(pontos);
}

function formatarCPF(valor) {
    let s = String(valor ?? "").replace(/\D/g, "");
    if (!s) return String(valor ?? "");
    s = s.padStart(11, "0");
    if (s.length !== 11) return String(valor);
    return s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
}

async function carregarPassageiros() {

    const json = await carregarAba(GIDS.passageiros);

    const cols = json.table.cols || [];
    let rows = json.table.rows || [];

    // Cabeçalho: usa os rótulos das colunas; se vierem vazios, usa a 1ª linha
    let cabecalho = cols.map(c => c.label || "");

    if (cabecalho.every(l => !l) && rows.length) {
        cabecalho = rows[0].c.map(c => String(c?.v ?? ""));
        rows = rows.slice(1);
    }

    const idxCPF = cabecalho.findIndex(h => /cpf/i.test(h));

    // Coluna do cartão de embarque: pelo título ou, se não achar, a que tem links
    let idxLink = cabecalho.findIndex(h => /cart[aã]o|embarque|link/i.test(h));
    if (idxLink < 0)
        idxLink = cabecalho.findIndex((h, i) =>
            rows.some(r => /^https?:\/\//i.test(String(r.c?.[i]?.v ?? ""))));

    // Remove colunas totalmente vazias e a coluna do link (ele vai no nome)
    const colunasUsadas = cabecalho
        .map((h, i) => i)
        .filter(i => i !== idxLink)
        .filter(i => cabecalho[i] || rows.some(r => valorCelula(r.c?.[i]) !== ""));

    const linhas = rows
        .filter(r => r.c && r.c.some(c => c && c.v != null && c.v !== ""))
        .map(r => {
            const valores = colunasUsadas.map(i => {
                const v = i === idxCPF
                    ? formatarCPF(r.c[i]?.v)
                    : valorCelula(r.c[i]);
                return String(v);
            });
            const link = idxLink >= 0 ? String(r.c[idxLink]?.v ?? "").trim() : "";
            return { valores, link: /^https?:\/\//i.test(link) ? link : "" };
        });

    dadosPassageiros = {
        cabecalho: colunasUsadas.map(i => cabecalho[i] || `Coluna ${i + 1}`),
        linhas
    };

    // Lista usada pelo visualizador (setas anterior/próximo)
    cartoesEmbarque = linhas
        .filter(l => l.link)
        .map(l => ({ nome: l.valores[0], link: l.link }));

    const card = document.querySelector("#passageiros .card");

    const termoAtual =
        document.getElementById("buscaPassageiro")?.value ?? "";

    card.innerHTML = `
        <input id="buscaPassageiro" class="busca" type="search"
            placeholder="Buscar por nome, CPF ou nº da compra..."
            oninput="renderizarPassageiros()">
        <div class="total" id="totalPassageiros"></div>
        <div class="tabela-wrap" id="tabelaPassageiros"></div>
    `;

    document.getElementById("buscaPassageiro").value = termoAtual;

    renderizarPassageiros();
}

function renderizarPassageiros() {

    const termo = (document.getElementById("buscaPassageiro")?.value ?? "")
        .toLowerCase().trim();

    const termoNum = termo.replace(/\D/g, "");

    const { cabecalho, linhas } = dadosPassageiros;

    const filtradas = linhas.filter(l => {
        if (!termo) return true;
        return l.valores.some(v => {
            const t = v.toLowerCase();
            return t.includes(termo) ||
                (termoNum && t.replace(/\D/g, "").includes(termoNum));
        });
    });

    const comCartao = linhas.filter(l => l.link).length;

    let html = comCartao
        ? `<p class="dica-cartao">🎫 Toque no nome para ver o cartão de embarque.</p>`
        : "";

    html += `<table><tr><th>#</th>${cabecalho.map(h => `<th>${escapar(h)}</th>`).join("")}</tr>`;

    filtradas.forEach((l, i) => {
        const celulas = l.valores.map((v, j) => {
            if (j === 0 && l.link) {
                const pos = cartoesEmbarque.findIndex(c => c.link === l.link && c.nome === v);
                return `<td><button class="link-cartao" onclick="abrirCartao(${pos})">🎫 ${escapar(v)}</button></td>`;
            }
            return `<td>${escapar(v)}</td>`;
        }).join("");
        html += `<tr><td>${i + 1}</td>${celulas}</tr>`;
    });

    html += "</table>";

    document.getElementById("tabelaPassageiros").innerHTML = html;

    document.getElementById("totalPassageiros").textContent =
        termo
            ? `${filtradas.length} de ${linhas.length} passageiros`
            : `Total: ${linhas.length} passageiros`;
}

/* ===================== FINANCEIRO ===================== */

const moeda = v => (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function numeroCelula(c) {
    if (!c || c.v == null || c.v === "") return 0;
    if (typeof c.v === "number") return c.v;
    let s = String(c.v).replace(/[R$\s]/g, "");
    const negativo = /^\(.*\)$/.test(s) || s.startsWith("-");
    s = s.replace(/[()\-]/g, "").replace(/\./g, "").replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? 0 : (negativo ? -n : n);
}

function dataCelula(c) {
    if (!c || c.v == null) return { texto: "", ordem: 0 };
    const m = String(c.v).match(/Date\((\d+),(\d+),(\d+)/);
    if (m) {
        const d = new Date(+m[1], +m[2], +m[3]);
        return { texto: d.toLocaleDateString("pt-BR"), ordem: d.getTime() };
    }
    return { texto: String(valorCelula(c)), ordem: 0 };
}

function linhasValidas(json) {
    return (json.table.rows || [])
        .filter(r => r.c && r.c[0] && r.c[0].v != null && String(r.c[0].v).trim() !== "");
}

function graficoBarras(itens, classe) {
    const max = Math.max(...itens.map(i => i.valor), 0.01);
    return itens.map(i => `
        <div class="barra-linha" title="${escapar(i.nome)}: ${moeda(i.valor)}">
            <div class="barra-nome">${escapar(i.nome)}</div>
            <div class="barra-trilho">
                <div class="barra ${classe}" style="width:${(i.valor / max * 100).toFixed(1)}%"></div>
            </div>
            <div class="barra-valor">${moeda(i.valor)}</div>
        </div>`).join("");
}

async function carregarFinanceiro() {

    const [saldo, extrato, despesas] = await Promise.all([
        carregarAba(GIDS.saldo),
        carregarAba(GIDS.extrato),
        carregarAba(GIDS.financeiro)
    ]);

    const arred = n => Math.round(n * 100) / 100;

    // Aba Saldo: Nome | Saldo Devedor | Saldo a Receber | <uma coluna por recebedor>
    // Cada célula da coluna D em diante = quanto a pessoa da linha deve passar
    // para a pessoa do cabeçalho da coluna. Dívida consigo mesmo é ignorada.
    const cols = saldo.table.cols.map(c => (c.label || "").trim());
    const linhasSaldo = linhasValidas(saldo);
    const nomes = linhasSaldo.map(r => String(r.c[0].v).trim());

    const transferencias = [];   // { de, para, valor }
    linhasSaldo.forEach(r => {
        const de = String(r.c[0].v).trim();
        for (let j = 3; j < cols.length; j++) {
            const para = cols[j];
            if (!para || para === de) continue;
            const valor = arred(Math.abs(numeroCelula(r.c[j])));
            if (valor >= 0.01) transferencias.push({ de, para, valor });
        }
    });

    // Se a aba ainda não tiver as colunas por recebedor, usa as colunas B/C
    const temMatriz = cols.length > 3;

    // Cor fixa por recebedor, na ordem das colunas da planilha
    const PALETA = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"];
    const ordemRecebedores = cols.slice(3).filter(n => transferencias.some(t => t.para === n));
    const corDe = nome => PALETA[ordemRecebedores.indexOf(nome) % PALETA.length] || "#64748b";

    const porDevedor = {};
    const porRecebedor = {};
    transferencias.forEach(t => {
        (porDevedor[t.de] ||= []).push(t);
        (porRecebedor[t.para] ||= []).push(t);
    });

    const soma = lista => arred(lista.reduce((s, t) => s + t.valor, 0));

    let devedores, recebedores;

    if (temMatriz) {
        devedores = Object.entries(porDevedor)
            .map(([nome, lista]) => ({ nome, valor: soma(lista), lista }))
            .sort((a, b) => b.valor - a.valor || a.nome.localeCompare(b.nome));
        recebedores = ordemRecebedores
            .map(nome => ({ nome, valor: soma(porRecebedor[nome]), lista: porRecebedor[nome] }));
    } else {
        const pessoas = linhasSaldo.map(r => ({
            nome: String(r.c[0].v).trim(),
            deve: arred(Math.abs(numeroCelula(r.c[1]))),
            recebe: arred(Math.abs(numeroCelula(r.c[2])))
        }));
        devedores = pessoas.filter(p => p.deve > 0).map(p => ({ nome: p.nome, valor: p.deve, lista: [] }));
        recebedores = pessoas.filter(p => p.recebe > 0).map(p => ({ nome: p.nome, valor: p.recebe, lista: [] }));
    }

    const emDia = nomes.filter(n =>
        !devedores.some(d => d.nome === n) && !recebedores.some(r => r.nome === n));

    // Aba Extrato: Remetente | Destinatário | Valor | Data
    const pagamentos = linhasValidas(extrato).map(r => ({
        de: String(valorCelula(r.c[0])),
        para: String(valorCelula(r.c[1])),
        valor: numeroCelula(r.c[2]),
        data: dataCelula(r.c[3])
    })).sort((a, b) => b.data.ordem - a.data.ordem);

    // Aba Financeiro: Elemento | Valor | Pessoas | Pagador | Valor parcela
    const itensDespesa = linhasValidas(despesas).map(r => ({
        elemento: String(valorCelula(r.c[0])),
        valor: numeroCelula(r.c[1]),
        pessoas: String(r.c[2]?.v ?? "").split(";").map(s => s.trim()).filter(Boolean),
        pagador: String(valorCelula(r.c[3])),
        porPessoa: numeroCelula(r.c[4])
    }));

    const totalPendente = devedores.reduce((s, i) => s + i.valor, 0);
    const totalPago = pagamentos.reduce((s, p) => s + p.valor, 0);
    const totalDespesas = itensDespesa.reduce((s, d) => s + d.valor, 0);

    let html = `
        <div class="tiles">
            <div class="tile">
                <div class="tile-rotulo">Ainda falta pagar</div>
                <div class="tile-valor" style="color:#9a3412">${moeda(totalPendente)}</div>
            </div>
            <div class="tile">
                <div class="tile-rotulo">Já pago (extrato)</div>
                <div class="tile-valor">${moeda(totalPago)}</div>
            </div>
            <div class="tile">
                <div class="tile-rotulo">Total de despesas</div>
                <div class="tile-valor">${moeda(totalDespesas)}</div>
            </div>
        </div>`;

    const legenda = recebedores.length > 1 ? `
        <div class="legenda-cores">
            ${recebedores.map(r => `
                <span><i style="background:${corDe(r.nome)}"></i>Passar para <strong>${escapar(r.nome)}</strong></span>`).join("")}
        </div>` : "";

    const maxDeve = Math.max(...devedores.map(d => d.valor), 0.01);

    const blocoDevedores = devedores.map(d => {
        const segmentos = d.lista.length
            ? d.lista.map(t => `<div class="seg" style="width:${(t.valor / maxDeve * 100).toFixed(2)}%;background:${corDe(t.para)}" title="${escapar(t.de)} → ${escapar(t.para)}: ${moeda(t.valor)}"></div>`).join("")
            : `<div class="seg" style="width:${(d.valor / maxDeve * 100).toFixed(2)}%;background:#c2410c"></div>`;
        const destinos = d.lista.map(t => `
            <li>
                <span class="ponto" style="background:${corDe(t.para)}"></span>
                <strong>${moeda(t.valor)}</strong> → passar para <strong>${escapar(t.para)}</strong>
            </li>`).join("");
        return `
            <div class="devedor">
                <div class="devedor-topo">
                    <span class="devedor-nome">${escapar(d.nome)}</span>
                    <span class="devedor-total">${moeda(d.valor)}</span>
                </div>
                <div class="barra-trilho empilhada">${segmentos}</div>
                ${destinos ? `<ul class="destinos">${destinos}</ul>` : ""}
            </div>`;
    }).join("");

    const maxRecebe = Math.max(...recebedores.map(r => r.valor), 0.01);

    const blocoRecebedores = recebedores.map(r => `
        <details class="recebedor">
            <summary>
                <div class="barra-linha" title="${escapar(r.nome)}: ${moeda(r.valor)}">
                    <div class="barra-nome">${escapar(r.nome)}</div>
                    <div class="barra-trilho">
                        <div class="barra" style="width:${(r.valor / maxRecebe * 100).toFixed(1)}%;background:${corDe(r.nome)}"></div>
                    </div>
                    <div class="barra-valor">${moeda(r.valor)}</div>
                </div>
                ${r.lista.length ? `<div class="recebedor-sub">de ${r.lista.length} pessoa${r.lista.length === 1 ? "" : "s"} · toque para ver quem</div>` : ""}
            </summary>
            ${r.lista.length ? `
                <table class="mini">
                    ${r.lista.slice().sort((a, b) => b.valor - a.valor || a.de.localeCompare(b.de))
                        .map(t => `<tr><td>${escapar(t.de)}</td><td class="num">${moeda(t.valor)}</td></tr>`).join("")}
                </table>` : ""}
        </details>`).join("");

    html += `
        <div class="fin-secao">
            <h3>💸 Quem deve passar para quem</h3>
            <div class="fin-legenda">Quanto cada pessoa ainda deve e para quem deve transferir, segundo a aba Saldo.</div>
            ${legenda}
            ${devedores.length ? blocoDevedores : "<p>Ninguém está devendo. 🎉</p>"}
        </div>

        <div class="fin-secao">
            <h3>🔺 Quanto cada um vai receber</h3>
            <div class="fin-legenda">Quem adiantou despesas e quanto ainda tem a receber dos outros.</div>
            ${recebedores.length ? blocoRecebedores : "<p>Ninguém tem valores a receber.</p>"}
        </div>`;

    if (emDia.length) {
        html += `
            <div class="fin-secao">
                <h3>✅ Em dia</h3>
                <div class="chips">
                    ${emDia.map(n => `<span class="chip">✓ ${escapar(n)}</span>`).join("")}
                </div>
            </div>`;
    }

    if (itensDespesa.length) {
        html += `
            <div class="fin-secao">
                <h3>🧾 Despesas</h3>
                <div class="tabela-wrap">
                <table>
                    <tr><th>Despesa</th><th>Valor</th><th>Por pessoa</th><th>Dividido entre</th><th>Pago por</th></tr>
                    ${itensDespesa.map(d => `
                        <tr>
                            <td>${escapar(d.elemento)}</td>
                            <td class="num">${moeda(d.valor)}</td>
                            <td class="num">${moeda(d.porPessoa)}</td>
                            <td title="${escapar(d.pessoas.join(", "))}">${d.pessoas.length} pessoa${d.pessoas.length === 1 ? "" : "s"}</td>
                            <td>${escapar(d.pagador)}</td>
                        </tr>`).join("")}
                </table>
                </div>
            </div>`;
    }

    if (pagamentos.length) {
        html += `
            <div class="fin-secao">
                <h3>📄 Pagamentos registrados</h3>
                <div class="tabela-wrap">
                <table>
                    <tr><th>Data</th><th>De</th><th>Para</th><th>Valor</th></tr>
                    ${pagamentos.map(p => `
                        <tr>
                            <td style="white-space:nowrap">${escapar(p.data.texto)}</td>
                            <td>${escapar(p.de)}</td>
                            <td>${escapar(p.para)}</td>
                            <td class="num">${moeda(p.valor)}</td>
                        </tr>`).join("")}
                </table>
                </div>
            </div>`;
    }

    document.querySelector("#financeiro .card").innerHTML = html;
}

async function atualizar() {

    try {

        // allSettled: se uma aba falhar, as outras continuam aparecendo
        const resultados = await Promise.allSettled([

            carregarViagem(),

            carregarRefeicao(
                GIDS.cafe,
                "cafe"
            ),

            carregarRefeicao(
                GIDS.almoco,
                "almoco"
            ),

            carregarRefeicao(
                GIDS.lanche,
                "lanche"
            ),

            carregarRefeicao(
                GIDS.jantar,
                "jantar"
            ),

            carregarIngredientes(),

            carregarPassageiros(),

            carregarFinanceiro()

        ]);

        const falhas = resultados.filter(r => r.status === "rejected");
        falhas.forEach(f => console.error(f.reason));

        if (falhas.length === resultados.length)
            throw new Error("Nenhuma aba carregou");

        document.getElementById("erro").innerHTML = falhas.length
            ? `<div class="erro">Algumas abas não puderam ser carregadas:<br>${falhas.map(f => "• " + escapar(f.reason?.message || f.reason)).join("<br>")}</div>`
            : "";

        document.getElementById(
            "ultimaAtualizacao"
        ).innerHTML =
            "Última atualização: " +
            new Date().toLocaleString(
                "pt-BR"
            );

    }
    catch (erro) {

        console.error(erro);

        document.getElementById(
            "erro"
        ).innerHTML = `

        <div class="erro">

            Erro ao carregar
            os dados da planilha.

        </div>

        `;
    }

}

atualizar();

setInterval(
    atualizar,
    300000
);

</script>
